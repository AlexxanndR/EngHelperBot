version: "3.2"

services:

    database:
        image: postgres:latest
        environment:
          POSTGRES_USER: ${DB_USER:-postgres}
          POSTGRES_PASSWORD: ${DB_PASS:-password}
        volumes:
          - ./db/data:/var/lib/postgresql/data
        ports:
          - 5000:5432
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 5s
          timeout: 5s
          retries: 5